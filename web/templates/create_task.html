{% extends "base.html" %}

{% block title %}Crea Task - Progetto Arrakis{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 30px auto;">
    <div class="card">
        <h2>Crea Nuovo Task</h2>
        <form method="POST">
            <div class="form-group">
                <label for="titolo">Titolo</label>
                <input type="text" id="titolo" name="titolo" required>
            </div>
            <div class="form-group">
                <label for="descrizione">Descrizione</label>
                <textarea id="descrizione" name="descrizione" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label for="stato">Stato</label>
                <select id="stato" name="stato">
                    <option value="todo">Todo</option>
                    <option value="in_progress">In Progress</option>
                    <option value="done">Done</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn">Crea Task</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-danger" style="background: var(--sand-dark);">Annulla</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
